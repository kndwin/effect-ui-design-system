id: component-files/app-component
language: TypeScript
severity: error
message: An app's *.component.ts exports an Html.component. See +rule/component-files/component-files.md.
rule:
  kind: program
  not:
    has:
      stopBy: end
      pattern: $HTML.component({ $$$ })
---
id: component-files/example-metadata
language: TypeScript
severity: error
message: A docs example exports `title` and `order`, and its Html.component as the default export. See +rule/component-files/component-files.md.
files:
  - src/examples/**/*.component.ts
rule:
  kind: program
  not:
    all:
      - has:
          stopBy: end
          pattern: export const title = $T
      - has:
          stopBy: end
          pattern: export const order = $O
      - has:
          stopBy: end
          kind: export_statement
          regex: ^export default
