id: component-style-files/exports
language: TypeScript
severity: error
message: A style file only exports `Style.make(Kit)({ … })`. See +rule/component-style-files/component-style-files.md.
rule:
  kind: lexical_declaration
  inside:
    kind: export_statement
  has:
    kind: variable_declarator
    has:
      field: value
      not:
        pattern: Style.make($$$)($$$)
---
id: component-style-files/imports
language: TypeScript
severity: error
message: Style files import only @acme/* modules and local files, so they stay data. See +rule/component-style-files/component-style-files.md.
rule:
  kind: import_statement
  has:
    field: source
    not:
      regex: ^["'](@acme/|\.)
