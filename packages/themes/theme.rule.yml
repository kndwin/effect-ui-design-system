id: theme/exports
language: TypeScript
severity: error
message: A theme file only exports Theme.make(Tokens, { … }). See theme.rule.md.
rule:
  kind: lexical_declaration
  inside:
    kind: export_statement
  has:
    kind: variable_declarator
    has:
      field: value
      not:
        pattern: Theme.make($$$)
---
id: theme/imports
language: TypeScript
severity: error
message: Theme files import only @acme/* modules. See theme.rule.md.
rule:
  kind: import_statement
  has:
    field: source
    not:
      regex: ^["'](@acme/|\.)
