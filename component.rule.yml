id: component/exports-ui
language: TypeScript
severity: error
message: A *.component.ts file exports UI, an Html.component or a view function. See component.rule.md.
rule:
  kind: program
  not:
    has:
      stopBy: end
      any:
        - pattern: $HTML.component({ $$$ })
        - kind: export_statement
          has:
            stopBy: end
            kind: arrow_function
