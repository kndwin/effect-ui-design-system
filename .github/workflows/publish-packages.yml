name: Publish packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: publish-packages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build:packages

      - name: Publish to pkg.pr.new
        run: >-
          pnpm exec pkg-pr-new publish --pnpm --packageManager=pnpm
          ./packages/design-system
          ./packages/css-engine
          ./packages/cli
          ./packages/components
          ./packages/themes/shadcn
          ./packages/themes/astryx
