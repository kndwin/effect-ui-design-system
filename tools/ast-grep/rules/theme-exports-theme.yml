id: theme-exports-theme
language: TypeScript
severity: error
message: A *.theme.ts file only exports `Theme.make(Tokens, { … })`. See rule.theme.md.
files:
  - "packages/**/src/**/*.theme.ts"
rule:
  kind: lexical_declaration
  inside:
    kind: export_statement
  has:
    kind: variable_declarator
    has:
      field: value
      not:
        pattern: Theme.make($$$)
