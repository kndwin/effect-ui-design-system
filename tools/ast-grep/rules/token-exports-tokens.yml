id: token-exports-tokens
language: TypeScript
severity: error
message: A *.token.ts file only exports `Token*.make(prefix, keys)` groups and the contract object. See rule.token.md.
files:
  - "packages/**/src/**/*.token.ts"
rule:
  kind: lexical_declaration
  inside:
    kind: export_statement
  has:
    kind: variable_declarator
    has:
      field: value
      not:
        any:
          - pattern: $TOKEN.make($$$)
          - kind: object
