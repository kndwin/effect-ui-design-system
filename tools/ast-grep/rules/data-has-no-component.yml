id: data-has-no-component
language: TypeScript
severity: error
message: Html.component isn't data. Move it to a *.component.ts file. See rule.pure.md.
files:
  - "packages/**/src/**/*.pure.ts"
  - "packages/**/src/**/*.component.style.ts"
  - "packages/**/src/**/*.token.ts"
  - "packages/**/src/**/*.theme.ts"
  - "apps/**/src/**/*.pure.ts"
rule:
  pattern: $HTML.component({ $$$ })
