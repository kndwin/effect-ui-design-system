id: css-has-no-runtime
language: TypeScript
severity: error
message: A *.css.ts file runs at build time. Don't import the runtime (@effect/ui) or define components in it.
files:
  - "packages/**/src/**/*.css.ts"
  - "apps/**/src/**/*.css.ts"
rule:
  any:
    - kind: import_statement
      has:
        field: source
        regex: ^["']@effect/ui(/html)?["']$
    - pattern: $HTML.component({ $$$ })
