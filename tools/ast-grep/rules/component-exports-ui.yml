id: component-exports-ui
language: TypeScript
severity: error
message: A *.component.ts file exports UI, an Html.component or a view function. Helpers go in *.pure.ts. See rule.component.md.
files:
  - "packages/**/src/**/*.component.ts"
  - "apps/**/src/**/*.component.ts"
rule:
  kind: program
  not:
    has:
      stopBy: end
      any:
        - pattern: $HTML.component({ $$$ })
        - kind: export_statement
          has:
            stopBy: end
            kind: arrow_function
