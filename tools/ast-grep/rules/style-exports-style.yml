id: style-exports-style
language: TypeScript
severity: error
message: A *.component.style.ts file only exports `Style.make(Kit)({ … })`. See rule.component.style.md.
files:
  - "packages/**/src/**/*.component.style.ts"
rule:
  kind: lexical_declaration
  inside:
    kind: export_statement
  has:
    kind: variable_declarator
    has:
      field: value
      not:
        pattern: Style.make($$$)($$$)
